name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-production:
    name: Production Build (AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write Google Service Account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/google-service-account.json

      - name: Build Android AAB with EAS
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit to Play Store internal track
        run: eas submit --platform android --profile production --latest --non-interactive

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## What's Changed
            See full diff and commit history above (auto-generated).

            ## Build
            Production AAB built by EAS and submitted to the Play Store **internal testing** track.
            Promote to production via: **Actions → Promote to Production**.
