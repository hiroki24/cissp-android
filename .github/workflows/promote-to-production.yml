name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to promote (leave empty to use the latest production build)'
        required: false
        default: ''

jobs:
  promote:
    name: Promote to Play Store Production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write Google Service Account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/google-service-account.json

      - name: Submit to Play Store production track
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            eas submit --platform android --profile promote --id "${{ github.event.inputs.build_id }}" --non-interactive
          else
            eas submit --platform android --profile promote --latest --non-interactive
          fi
